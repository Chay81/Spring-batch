server:
  port: 8081

spring:
  application:
    name: springbatch

  jpa:
     hibernate:
       ddl-auto: update
     show-sql: true
     properties:
       hibernate:
         format_sql: true
     defer-datasource-initialization: true

  datasource:
    url: jdbc:mysql://localhost:3306/spring_batch_db
    username: root   # change if needed
    password: root   # change if needed
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 20

#  sql:
#     init:
#       mode: always
#       continue-on-error: true
#       schema-locations: classpath:/schema-h2.sql

#  datasource:
#    url: jdbc:h2:mem:testdb
#    driverClassName: org.h2.Driver
#    username: sa
#    password:
#      hikari:
#        maximum-pool-size: 20

#  h2:
#    console:
#      enabled: true
#      path: /h2-console

  batch:
    jdbc:
      initialize-schema: never # creates BATCH_* tables automatically, change to never after first run to prevent data loss
    job:
      enabled: false # prevents auto-run on startup

logging:
  level:
    root: INFO
    org.springframework.batch: INFO

#input:
#  dir: ${INPUT_DIR:input}

app:
  input-dir: ./input
  archive-dir: ./archive

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    enabled:
        all: true
    tags:
      application: spring-batch-app
    enable:
      spring.batch: false
    export:
      prometheus:
        enabled: true

